name: Gerar APK GDC Transportes

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          mkdir app
          unzip -q GDC_Transportes_Android_Capacitor.zip -d app

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        working-directory: app
        run: |
          npm install
          npm install --save-dev typescript

      - name: Criar projeto Android
        working-directory: app
        run: npx cap add android

      - name: Sincronizar Capacitor
        working-directory: app
        run: npx cap sync android

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gerar APK
        working-directory: app/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: GDC-Transportes-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
